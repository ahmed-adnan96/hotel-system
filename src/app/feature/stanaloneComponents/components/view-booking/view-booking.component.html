<mat-dialog-actions align="end" class="py-0">
  <button type="button" (click)="CloseModal()">
    <mat-icon class="bg-red-500 rounded-full text-white">cancel</mat-icon>
  </button>
</mat-dialog-actions>

<mat-dialog-content class="grid grid-cols-2 gap-4 pb-4 pt-0 mb-3">
  <!-- Room Image
  <div class="col-span-2 bg-black flex justify-center">
    @if(data.room.images){
    <img [src]="data.room.images[0]" alt="Room Image" class="w-30 h-20 object-cover rounded-lg shadow-md border" />
    }@else {
    <img src="assets/images/img-profile.jpg" class="w-30 h-20 object-cover rounded-lg shadow-md border"  alt="Room Image">
    }
  </div> -->

  <!-- Room Number -->
  <div class="bg-gray-50 py-2 px-4 rounded-lg shadow-sm text-center">
    <span class="block text-gray-500 text-sm text-left">Room Number:</span>
    <span class="font-medium text-center">{{data.room.roomNumber}}</span>
  </div>

  <!-- Capacity -->
  <div class="bg-gray-50 py-2 px-4 rounded-lg shadow-sm text-center">
    <span class="block text-gray-500 text-sm text-left">User</span>
    <span class="font-medium text-center">{{data.user.userName}}</span>
  </div>

  <!-- Status -->
  <div class="bg-gray-50 py-2 px-4 rounded-lg shadow-sm text-center">
    <span class="block text-gray-500 text-sm text-left">Status:</span>
    <span class="text-green-600" >
      {{data.status}}
    </span>
  </div>

  <!-- Price -->
  <div class="bg-gray-50 py-2 px-4 rounded-lg shadow-sm text-center">
    <span class="block text-gray-500 text-sm text-left">Price:</span>
    <span class="font-medium text-center">{{data.totalPrice}} EGP</span>
  </div>
  <!-- Created At -->
  <div class="bg-gray-50 py-2 px-4 rounded-lg shadow-sm text-center">
    <span class="block text-gray-500 text-sm text-left">Created At:</span>
    <span class="font-medium text-center">{{ data.createdAt | date:'dd-mm-yyyy' }}</span>
  </div>

  <!-- Updated At -->
  <div class="bg-gray-50 py-2 px-4 rounded-lg shadow-sm text-center">
    <span class="block text-gray-500 text-sm text-left">Updated At:</span>
    <span class="font-medium text-center">{{ data.updatedAt |date:'dd-mm-yyyy' }}</span>
  </div>
</mat-dialog-content>

<nav class="flex items-center justify-between flex-wrap bg-white py-4 lg:px-12 shadow border-solid border-t-2">
  <div
    class="flex justify-between lg:w-auto w-full lg:border-b-0 pl-6 pr-2 border-solid border-b-2 border-gray-300 pb-5 lg:pb-0">
    <div class="flex items-center flex-shrink-0 text-gray-800 mr-16">
      <span class="font-semibold text-xl tracking-tight"><img src="../../../../../assets/images/logo.svg" alt=""></span>
    </div>
    <div class="block lg:hidden ">
      <button  id="nav"
        class="flex items-center px-3 py-2 border-2 rounded text-blue-700 border-blue-700 hover:text-blue-700 hover:border-blue-700">
        <svg class="fill-current h-3 w-3" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <title>Menu</title>
          <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
        </svg>
      </button>
    </div>

  </div>

  <div class="menu w-full lg:flex lg:items-center lg:w-auto lg:px-3 px-8">
    <div class="font-bold">
      @for (item of navMenu; track $index) {
      @if (item.isActive) {
      <a [routerLink]="item.menuLink" routerLinkActive="text-primary"
        class="block mt-4 lg:inline-block lg:mt-0 px-4 py-2 rounded mr-2">
        {{ item.title | translate }}
      </a>
      }
      }
    </div>



    <div class="flex">
      <div class="text-md font-bold text-wh-700 text-blue-950 mx-3 center px-3">
        <a class="block mt-4 lg:inline-block lg:mt-0  px-1 py-2 rounded mr-2">
          {{"navbar.Lang"|translate}}
        </a>
        <mat-icon [matMenuTriggerFor]="menu">language</mat-icon>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="change('ar')"
            [ngClass]="{ 'bg-primary text-white': _TranslateService.currentLang === 'ar' }">
            <span>ar</span>
          </button>
          <button mat-menu-item (click)="change('en')"
            [ngClass]="{ 'bg-primary text-white': _TranslateService.currentLang === 'en' }">
            <span>en</span>
          </button>
        </mat-menu>

      </div>
      @if (!isLoggedIn()) {


      <div class="center gap-3">
        <a routerLink="/auth/createUser" class="btn py-2 px-4">
          {{"navbar.Register"|translate}}
        </a>
        <a routerLink="/auth/login" class=" btn py-2 px-4">
          {{"navbar.Login Now"|translate}}
        </a>
      </div>
      }
      @if (isLoggedIn()) {
      <div>
        <div class="center">
          <div class="flex items-center justify-center gap-2 user-profile">
            <img [src]="imagePath" alt="{{username}}" />
            <span class="mx-2">{{username}}</span>
          </div>
          <mat-icon [matMenuTriggerFor]="menu">arrow_drop_down
          </mat-icon>
        </div>

        <mat-menu #menu="matMenu">
          <button mat-menu-item routerLink="/landPage/layoutRoom/myProfile">
            <mat-icon class="custom-Icon">person</mat-icon>
            <span>Show My profile</span>
          </button>
          <button mat-menu-item routerLink="/auth/changePassword">
            <mat-icon class="custom-Icon">lock_reset</mat-icon>
            <span>Change Password</span>
          </button>
          <button mat-menu-item (click)="logOut()">
            <mat-icon class="custom-Icon">logout</mat-icon>
            <span>Log out</span>
          </button>
        </mat-menu>
      </div>
      }

    </div>
  </div>

</nav>

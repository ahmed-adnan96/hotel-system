<section>
  <div class="p-5">
    <div class="flex justify-between items-center mb-20">
      <div>
        <h2 class="text-2xl font-medium">ADS Table Details</h2>
        <p class="font-reguler">You can check all details</p>
      </div>
      <button type="button" (click)="openDialog()" class="btn px-10 font-bold" color="primary">Add New Ads</button>
    </div>
    <mat-form-field class="w-full">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
    </mat-form-field>
    <div class="overflow-x-auto w-full">
      <table mat-table [dataSource]="dataSource" matSort class="w-full">
        <!-- room Number Column -->
        <ng-container matColumnDef="roomNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="roomNumber"> Room Number </th>
          <td mat-cell *matCellDef="let element"> {{element.room.roomNumber}} </td>
        </ng-container>

        <!-- price Column -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="price"> Price </th>
          <td mat-cell *matCellDef="let element">{{element.room.price}} EGP</td>
        </ng-container>

        <!-- capacity Column -->
        <ng-container matColumnDef="capacity">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="capacity"> Capacity </th>
          <td mat-cell *matCellDef="let element">{{element.room.capacity}}</td>
        </ng-container>
        <!-- discount Column -->
        <ng-container matColumnDef="discount">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="discount"> Discount </th>
          <td mat-cell *matCellDef="let element"> {{element.room.discount}}%</td>
        </ng-container>
        <!-- isActive Column -->
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="isActive"> Active </th>
          <td mat-cell *matCellDef="let element"> {{element.isActive === false?'No':'Yes'}} </td>
        </ng-container>
        <!-- Action Column -->
        <ng-container matColumnDef="Action">
          <th mat-header-cell *matHeaderCellDef> Action </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" class="px-3 bg-white">
              <!-- (click)="openFacilityDialog(element, 'viewFacility')" -->
              <button mat-menu-item (click)="openDialogView(element)">
                <mat-icon class="text-primary" fontIcon="visibility"></mat-icon>
                <span>View</span>
              </button>
              <button mat-menu-item (click)="openEditDialog(element._id)">
                <mat-icon class="text-primary" fontIcon="edit_square"></mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item (click)="openDialogDelete(element._id,'')">
                <mat-icon class="text-primary" fontIcon="delete"></mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>

    </div>
  </div>
</section>
<mat-paginator class="bg-transparent" [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]">
</mat-paginator>

<nav class="flex  items-center py-7">
  <div class="text-xl  font-medium">
    <ol class="flex items-center space-x-2">
      <li>
        <a routerLink="/Home" class="text-gray-400 hover:text-[#B0B0B0]">{{'roomDetails.Home'|translate}}</a>
      </li>
      <li>
        <span class="text-gray-400">/</span>
      </li>
      <li>
        <span class="text-[#152c5B]">Explore</span>
      </li>
    </ol>
  </div>
  <div class="flex flex-col items-center mx-auto pe-44">
    <h1 class="text-[#152C5B] font-semibold  text-4xl">Explore ALL Rooms </h1>
  </div>
</nav>


<div class="grid grid-cols-4 gap-7 py-10">
  <div *ngFor="let room of roomList">
    <div class="room-description relative ad-card mb-3 card">
      <img [src]="room.images[0]||'assets/images/Hotel Booking.gif'" alt="Room image"
        class=" h-64 object-cover w-full rounded-lg" />
      <span class="ad-card-badge">{{ room.discount | currency
        }}<span class="text-xs font-thin"> Off </span></span>
      <div class="icons">
        <span [routerLink]="['/RoomDetails',room._id]"
          class="mx-2"><mat-icon>visibility</mat-icon></span><span><mat-icon>favorite</mat-icon></span>
      </div>
      <div class="section-content mt-2">
        <h6 class="font-medium text-blue-950">{{ room.roomNumber }}</h6>
        <p class="font-light text-sm text-gray-500">Lorem ipsum mollitia</p>
      </div>
    </div>
  </div>
</div>

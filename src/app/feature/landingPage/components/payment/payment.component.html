<section class="py-20">
  <div class="flex flex-col items-center justify-center h-full mb-10">
    <h1 class="text-[#152C5B] font-semibold  text-4xl">Payment</h1>
    <p class="text-gray-400 font-light">Kindly follow the instructions below</p>
  </div>
  <div class=" w-1/2 flex flex-col mx-auto items-center gap-y-12">
    <div [formGroup]="checkoutForm" class="w-full">
      <div class="flex justify-between gap-4 mb-10">
        <mat-form-field class="w-1/2" appearance="outline">
          <input matInput placeholder="Name" formControlName="name" />
        </mat-form-field>

        <mat-form-field class="w-1/2" appearance="outline">
          <input matInput placeholder="Email" type="email" formControlName="email" />
        </mat-form-field>
      </div>

      <ngx-stripe-elements [stripe]="stripe" class=" bg-black" [elementsOptions]="elementsOptions">
        <ngx-stripe-card [options]="cardOptions"></ngx-stripe-card>
      </ngx-stripe-elements>
    </div>
    <div class="flex justify-between items-center w-full border-t pt-4">
      <span class="text-lg font-medium text-gray-700">Total Price</span>
      <span class="text-xl font-bold text-primary">{{ totalPrice | currency }}</span>
    </div>
    <div class="flex flex-col gap-4 mt-5">
      <button class="bg-primary text-white font-semibold px-20 py-3 rounded-md" type="button" (click)="createToken()">
        Continue to Book
      </button>
      <button class="bg-gray-200 text-gray-400 font-semibold px-20 py-3 rounded-md" type="button" routerLink="/Home">
        Cancel
      </button>
    </div>
  </div>
</section>

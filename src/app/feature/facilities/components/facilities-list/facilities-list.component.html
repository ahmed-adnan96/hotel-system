<section>
  <div class="p-5">
    <div class="flex justify-between items-center mb-20">
      <div class="">
        <h2 class="text-2xl font-medium">Facilities Table Details</h2>
        <p class="font-reguler">You can check all details</p>
      </div>
      <button (click)="openFacilityDialog(null, 'addFacility')" type="button" class="btn px-10 font-bold"
        color="primary">Add New Facility</button>
    </div>
    <mat-form-field class="w-full">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
    </mat-form-field>
    <div class="overflow-x-auto w-full">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)" class="w-full">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <!-- createdBy Column -->
        <ng-container matColumnDef="createdBy">
          <th mat-header-cell *matHeaderCellDef> createdBy </th>
          <td mat-cell *matCellDef="let element"> {{element.createdBy?.userName}} </td>
        </ng-container>

        <!-- createdAt Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef> createdAt </th>
          <td mat-cell *matCellDef="let element"> {{element.createdAt| date }} </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef> Action </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" class="px-3 bg-white">
              <button mat-menu-item (click)="openFacilityDialog(element, 'viewFacility')">
                <mat-icon class="text-primary" fontIcon="visibility"></mat-icon>
                <span>View</span>
              </button>
              <button mat-menu-item (click)="openFacilityDialog(element, 'editFacility')">
                <mat-icon class="text-primary" fontIcon="edit_square"></mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item (click)="openDialog(element._id,'')">
                <mat-icon class="text-primary" fontIcon="delete"></mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
    </div>
  </div>
</section>

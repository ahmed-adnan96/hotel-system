<div class="w-full my-2 shadow rounded-2xl bg-gray-50">
  <div class="flex flex-col md:flex-row items-center md:justify-between p-3 gap-3">
    <div class="relative w-full">
      <mat-icon class=" absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">search
      </mat-icon>
      <input type="text" aria-label="Search"
        class="w-full pl-10 pr-4 py-2 rounded-lg bg-gray-100 border border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Search Here" />
    </div>
    <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
      <div class="flex items-center gap-2">
        <img [src]="imagePath"/>
        <span class="mx-2">{{username}}</span>
      </div>
      <mat-icon [matMenuTriggerFor]="menu">arrow_drop_down
      </mat-icon>

      <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/dashboard/myProfile">
          <mat-icon class="custom-Icon">person</mat-icon>
          <span>Show My profile</span>
        </button>
        <button mat-menu-item routerLink="/auth/changePassword">
          <mat-icon class="custom-Icon">lock_reset</mat-icon>
          <span>Change Password</span>
        </button>
        <button mat-menu-item (click)="logOut()">
          <mat-icon class="custom-Icon">logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
      <div class="relative">
        <mat-icon class="mat-18">notifications</mat-icon>
        <span class="absolute -top-1 -right-1 inline-block w-2 h-2 bg-red-600 rounded-full"></span>
      </div>
    </div>

  </div>
</div>

<Section>
    <div class="py-10 font-bold">
        <h2>Users Table Details</h2>
        <p>You can check all details</p>
    </div>
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
        class="mat-elevation-z8 improved-table">
        <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef>
                <div mat-sort-header>userName</div>

            </th>
            <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>
                <div mat-sort-header>email</div>

            </th>
            <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>
        <ng-container matColumnDef="phoneNumber">
            <th mat-header-cell *matHeaderCellDef>
                <div mat-sort-header>phoneNumber</div>

            </th>
            <td mat-cell *matCellDef="let element"> {{element.phoneNumber}} </td>
        </ng-container>
        <ng-container matColumnDef="country">
            <th mat-header-cell *matHeaderCellDef>
                <div mat-sort-header>country</div>

            </th>
            <td mat-cell *matCellDef="let element"> {{element.country}} </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>
                <div mat-sort-header>createdAt</div>

            </th>
            <td mat-cell *matCellDef="let element"> {{element.createdAt|date:"dd-MM-yyyy"}} </td>
        </ng-container>

        <ng-container matColumnDef="updatedAt">
            <th mat-header-cell *matHeaderCellDef>
                <div mat-sort-header>updatedAt</div>
            </th>
            <td mat-cell *matCellDef="let element"> {{element.updatedAt|date:"dd-MM-yyyy"}} </td>
        </ng-container>
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>
                <div>Action</div>
            </th>
            <td mat-cell *matCellDef="let element">
                <button type="button" (click)="openDialogView(element)" class="center gap-2">
                    <mat-icon class="text-primary">visibility</mat-icon> <span>View</span>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <div>
        <mat-paginator [length]="totalCount" [pageSizeOptions]="[10, 50, 100]" aria-label="Select page"
            (page)="handlePageEvent($event)" [pageIndex]="page +1" [pageSize]="size"
            [showFirstLastButtons]="showFirstLastButtons">
        </mat-paginator>
    </div>
</Section>
